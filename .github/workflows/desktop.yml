# Builds the desktop app: a .dmg for macOS (one file for Apple Silicon and Intel) and an
# installer for Windows (.msi and .exe).
#
# - Push a version tag (git tag v0.3.0 && git push --tags): the installers go to a draft
#   release on GitHub, to check and publish.
# - Or run it by hand (Actions → Desktop app → Run workflow): the installers are attached to
#   the run as artifacts, for a quick try.
name: Desktop app

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write # for the draft release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
            bundles: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          - platform: windows-latest
            args: ''
            bundles: |
              src-tauri/target/release/bundle/msi/*.msi
              src-tauri/target/release/bundle/nsis/*.exe
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          # Both Mac processors, for one app that runs on either.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # cTrader Open API app, built into the app (see src-tauri/build.rs). Repository
          # secrets: Settings → Secrets and variables → Actions. Without them cTrader is off.
          CTRADER_CLIENT_ID: ${{ secrets.CTRADER_CLIENT_ID }}
          CTRADER_CLIENT_SECRET: ${{ secrets.CTRADER_CLIENT_SECRET }}
        with:
          # Only a tag makes a release; a run by hand just builds.
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: ChartDesk ${{ github.ref_name }}
          releaseBody: See CHANGELOG.md for what's new. The macOS and Windows builds are not signed yet; see the README for how to open them.
          releaseDraft: true
          args: ${{ matrix.args }}

      - if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v5
        with:
          name: ChartDesk-${{ runner.os }}
          path: ${{ matrix.bundles }}
          if-no-files-found: error
